<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客戶檔案管理 - 出勤系統</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .customer-container {
            max-width: 1400px;
            margin: 20px auto;
            padding: 20px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .page-header h1 {
            margin: 0;
            color: #333;
        }

        .back-btn {
            padding: 10px 20px;
            background: #f0f0f0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .customer-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        .customer-tab {
            padding: 12px 24px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-size: 16px;
            color: #666;
            transition: all 0.3s;
        }

        .customer-tab.active {
            color: #4285f4;
            border-bottom-color: #4285f4;
            font-weight: 600;
        }

        .customer-tab:hover {
            color: #4285f4;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .customer-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .customer-form {
            display: grid;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }

        .form-group input,
        .form-group textarea {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #4285f4;
            color: white;
        }

        .btn-primary:hover {
            background: #3367d6;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-danger {
            background: #ea4335;
            color: white;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 13px;
        }

        .search-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .search-bar input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        th {
            background: #f8f9fa;
            font-weight: 600;
            color: #555;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-active {
            background: #e6f4ea;
            color: #1e7e34;
        }

        .badge-deleted {
            background: #fdecea;
            color: #c5221f;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .action-btns {
            display: flex;
            gap: 8px;
        }

        .detail-section {
            margin-top: 16px;
        }

        .detail-row {
            display: flex;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .detail-label {
            width: 120px;
            color: #888;
            flex-shrink: 0;
        }

        .detail-value {
            color: #333;
            flex: 1;
        }

        #admin-only-hint {
            background: #fff8e1;
            border: 1px solid #ffe082;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 16px;
            color: #8a6d00;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="customer-container">
        <div class="page-header">
            <h1>客戶檔案管理</h1>
            <button class="back-btn" onclick="window.location.href='index.html'">← 返回首頁</button>
        </div>

        <div id="admin-only-hint" style="display:none;">
            您目前為一般帳號，僅能查看客戶清單；新增／編輯／刪除功能僅限管理員使用。
        </div>

        <div class="customer-tabs">
            <button class="customer-tab active" data-tab="list">客戶清單</button>
            <button class="customer-tab" data-tab="add" id="add-tab-btn" style="display:none;">新增客戶</button>
            <button class="customer-tab" data-tab="detail" id="detail-tab-btn" style="display:none;">客戶詳情</button>
        </div>

        <!-- 客戶清單 -->
        <div class="tab-content active" id="list-tab">
            <div class="customer-card">
                <div class="search-bar">
                    <input type="text" id="search-input" placeholder="搜尋客戶名稱、聯絡人、電話...">
                    <button class="btn btn-secondary" onclick="loadCustomers()">重新整理</button>
                </div>
                <div id="customer-list-container">
                    <div class="empty-state">載入中...</div>
                </div>
            </div>
        </div>

        <!-- 新增/編輯客戶 -->
        <div class="tab-content" id="add-tab">
            <div class="customer-card">
                <h2 id="form-title" style="margin-top:0;">新增客戶</h2>
                <form class="customer-form" id="customer-form">
                    <input type="hidden" id="edit-customer-id" value="">
                    <div class="form-row">
                        <div class="form-group">
                            <label>客戶名稱 *</label>
                            <input type="text" id="f-customerName" required>
                        </div>
                        <div class="form-group">
                            <label>聯絡人</label>
                            <input type="text" id="f-contactPerson">
                        </div>
                        <div class="form-group">
                            <label>電話</label>
                            <input type="text" id="f-phone">
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="f-email">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>地址</label>
                        <input type="text" id="f-address">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>合約起始日</label>
                            <input type="date" id="f-contractStart">
                        </div>
                        <div class="form-group">
                            <label>合約結束日</label>
                            <input type="date" id="f-contractEnd">
                        </div>
                        <div class="form-group">
                            <label>服務地點</label>
                            <input type="text" id="f-serviceLocation" placeholder="若與地址不同才需填寫">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>服務項目</label>
                        <textarea id="f-serviceItems" placeholder="例如：冷氣定期保養、緊急維修..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>備註</label>
                        <textarea id="f-note"></textarea>
                    </div>
                    <div class="btn-group">
                        <button type="submit" class="btn btn-primary" id="submit-btn">儲存客戶</button>
                        <button type="button" class="btn btn-secondary" onclick="resetForm()">清除</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- 客戶詳情 -->
        <div class="tab-content" id="detail-tab">
            <div class="customer-card">
                <div id="detail-container">
                    <div class="empty-state">請從客戶清單點選「檢視」</div>
                </div>
            </div>
            <div class="customer-card">
                <h2 style="margin-top:0;">服務日誌紀錄</h2>
                <div id="detail-worklogs-container">
                    <div class="empty-state">—</div>
                </div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="customer.js"></script>
</body>
</html>
